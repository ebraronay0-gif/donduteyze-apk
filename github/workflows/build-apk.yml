name: Android APK Oluştur

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 24 kur
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: ZIP dosyasını bul
        shell: bash
        run: |
          set -e

          ZIP="donduteyze-apk-fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "HATA: ZIP bulunamadı: $ZIP"
            echo "Depodaki dosyalar:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP bulundu: $ZIP"

      - name: ZIP dosyasını aç
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "donduteyze-apk-fixed.zip" -d extracted

          echo "ZIP açıldı."

          find extracted -type f | head -150

      - name: Projeyi bul
        shell: bash
        run: |
          set -e

          PACKAGE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "package.json" \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "HATA: package.json bulunamadı!"
            find "$GITHUB_WORKSPACE/extracted" -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE")"

          echo "Proje klasörü: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: NPM paketlerini kur
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm install --no-package-lock

      - name: Web uygulamasını derle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm run build

      - name: Capacitor Android ekle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor senkronize et
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap sync android

      - name: DÖNDÜ TEYZE İKONUNU ZORLA UYGULA
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "DÖNDÜ TEYZE İKON DÜZELTMESİ BAŞLIYOR"
          echo "======================================"

          ICON=""

          if [ -f "resources/launcher-icon-final.png" ]; then
            ICON="resources/launcher-icon-final.png"
          fi

          if [ -z "$ICON" ] && [ -f "resources/icon.png" ]; then
            ICON="resources/icon.png"
          fi

          if [ -z "$ICON" ]; then
            ICON=$(find . -type f \
              \( -name "launcher-icon-final.png" -o -name "icon.png" \) \
              -print -quit)
          fi

          if [ -z "$ICON" ]; then
            echo "HATA: Döndü Teyze ikon dosyası bulunamadı!"
            echo "Bulunan PNG dosyaları:"
            find . -type f -name "*.png" -print
            exit 1
          fi

          echo "Kullanılan ikon:"
          echo "$ICON"

          ANDROID="android/app/src/main"

          mkdir -p "$ANDROID/res/mipmap-mdpi"
          mkdir -p "$ANDROID/res/mipmap-hdpi"
          mkdir -p "$ANDROID/res/mipmap-xhdpi"
          mkdir -p "$ANDROID/res/mipmap-xxhdpi"
          mkdir -p "$ANDROID/res/mipmap-xxxhdpi"

          echo "Eski adaptive ikonlar temizleniyor..."

          rm -rf "$ANDROID/res/mipmap-anydpi-v26"
          rm -rf "$ANDROID/res/mipmap-anydpi"

          echo "Eski launcher ikonları temizleniyor..."

          rm -f "$ANDROID/res/mipmap-mdpi/ic_launcher.png"
          rm -f "$ANDROID/res/mipmap-mdpi/ic_launcher_round.png"

          rm -f "$ANDROID/res/mipmap-hdpi/ic_launcher.png"
          rm -f "$ANDROID/res/mipmap-hdpi/ic_launcher_round.png"

          rm -f "$ANDROID/res/mipmap-xhdpi/ic_launcher.png"
          rm -f "$ANDROID/res/mipmap-xhdpi/ic_launcher_round.png"

          rm -f "$ANDROID/res/mipmap-xxhdpi/ic_launcher.png"
          rm -f "$ANDROID/res/mipmap-xxhdpi/ic_launcher_round.png"

          rm -f "$ANDROID/res/mipmap-xxxhdpi/ic_launcher.png"
          rm -f "$ANDROID/res/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "Yeni ikonlar oluşturuluyor..."

          convert "$ICON" \
            -resize 48x48 \
            -background none \
            -gravity center \
            -extent 48x48 \
            "$ANDROID/res/mipmap-mdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 72x72 \
            -background none \
            -gravity center \
            -extent 72x72 \
            "$ANDROID/res/mipmap-hdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 96x96 \
            -background none \
            -gravity center \
            -extent 96x96 \
            "$ANDROID/res/mipmap-xhdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 144x144 \
            -background none \
            -gravity center \
            -extent 144x144 \
            "$ANDROID/res/mipmap-xxhdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 192x192 \
            -background none \
            -gravity center \
            -extent 192x192 \
            "$ANDROID/res/mipmap-xxxhdpi/ic_launcher.png"

          cp "$ANDROID/res/mipmap-mdpi/ic_launcher.png" \
             "$ANDROID/res/mipmap-mdpi/ic_launcher_round.png"

          cp "$ANDROID/res/mipmap-hdpi/ic_launcher.png" \
             "$ANDROID/res/mipmap-hdpi/ic_launcher_round.png"

          cp "$ANDROID/res/mipmap-xhdpi/ic_launcher.png" \
             "$ANDROID/res/mipmap-xhdpi/ic_launcher_round.png"

          cp "$ANDROID/res/mipmap-xxhdpi/ic_launcher.png" \
             "$ANDROID/res/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$ANDROID/res/mipmap-xxxhdpi/ic_launcher.png" \
             "$ANDROID/res/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "======================================"
          echo "İKON DOSYALARI OLUŞTURULDU"
          echo "======================================"

          find "$ANDROID/res" \
            -type f \
            \( -name "ic_launcher.png" -o -name "ic_launcher_round.png" \) \
            -print

      - name: AndroidManifest ikonunu ayarla
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "HATA: AndroidManifest.xml bulunamadı!"
            exit 1
          fi

          echo "Manifest ikonları düzenleniyor..."

          sed -i 's/android:icon="@[^"]*"/android:icon="@mipmap\/ic_launcher"/g' "$MANIFEST"

          sed -i 's/android:roundIcon="@[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' "$MANIFEST"

          if ! grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"; then
            sed -i 's/<application/<application android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/' "$MANIFEST"
          fi

          echo "Manifest:"
          grep -n "android:icon\|android:roundIcon" "$MANIFEST" || true

      - name: AdMob App ID ekle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i '/<application/i\
    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />' "$MANIFEST"
          fi

          echo "AdMob App ID kontrol edildi."

      - name: SON İKON KONTROLÜ
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "======================================"
          echo "SON İKON KONTROLÜ"
          echo "======================================"

          echo ""
          echo "Manifest:"
          grep -n "android:icon\|android:roundIcon" \
            android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "Launcher ikonları:"

          find android/app/src/main/res \
            -type f \
            \( -name "ic_launcher.png" -o -name "ic_launcher_round.png" \) \
            -print

          echo ""
          echo "Adaptive icon kontrolü:"

          if [ -d "android/app/src/main/res/mipmap-anydpi-v26" ]; then
            echo "UYARI: mipmap-anydpi-v26 hâlâ mevcut!"
          else
            echo "OK: Eski adaptive ikon klasörü yok."
          fi

          echo ""
          echo "======================================"
          echo "İKON KONTROLÜ TAMAMLANDI"
          echo "======================================"

      - name: APK oluştur
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew clean assembleDebug --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: donduteyze-icon-final
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
