name: Android APK Oluştur

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 24 kur
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: ZIP dosyasını bul
        shell: bash
        run: |
          set -e

          ZIP="donduteyze-apk-fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "HATA: ZIP bulunamadı: $ZIP"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "ZIP bulundu: $ZIP"

      - name: ZIP dosyasını aç
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "donduteyze-apk-fixed.zip" -d extracted

          echo "ZIP açıldı."

      - name: Projeyi bul
        shell: bash
        run: |
          set -e

          PACKAGE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "package.json" \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "HATA: package.json bulunamadı!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE")"

          echo "Proje klasörü: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: NPM paketlerini kur
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install --no-package-lock

      - name: Web uygulamasını derle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm run build

      - name: Capacitor Android ekle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor senkronize et
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Döndü Teyze ikonunu zorla uygula
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "=== İKON KONTROLÜ ==="

          if [ -f "scripts/force-donduteyze-icon.sh" ]; then
            chmod +x scripts/force-donduteyze-icon.sh
            ./scripts/force-donduteyze-icon.sh
          else
            echo "force-donduteyze-icon.sh bulunamadı."
            echo "ZIP içindeki ikon kaynakları aranıyor..."
            find . -iname "*donduteyze*" -o -iname "*launcher*" | head -100
          fi

      - name: Manifest ikon kontrolü
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "HATA: AndroidManifest.xml bulunamadı!"
            exit 1
          fi

          echo "=== MANIFEST İKON AYARLARI ==="
          grep -n "android:icon\|android:roundIcon" "$MANIFEST" || true

      - name: AdMob App ID kontrolü
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i '/<application/i\
    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />' "$MANIFEST"
          fi

      - name: Gradle temizle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/android"

          chmod +x gradlew
          ./gradlew clean --no-daemon

      - name: APK oluştur
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/android"

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK ikonunu doğrula
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "=== SON İKON DOSYALARI ==="
          find android/app/src/main/res \
            -type f \
            \( -iname "*donduteyze*" -o -iname "*launcher*" \) \
            -print

          echo "=== MANIFEST ==="
          grep -n "android:icon\|android:roundIcon" \
            android/app/src/main/AndroidManifest.xml || true

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: donduteyze-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
