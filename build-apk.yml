name: Android APK Oluştur

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - REPoyu indir
      # ============================================================
      - name: Depoyu indir
        uses: actions/checkout@v5

      # ============================================================
      # 2 - JAVA 17
      # ============================================================
      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3 - NODE 24
      # ============================================================
      - name: Node.js 24 kur
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # ============================================================
      # 4 - ANDROID SDK
      # ============================================================
      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      # ============================================================
      # 5 - GEREKLİ ARAÇLAR
      # ============================================================
      - name: Görsel araçlarını kur
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y imagemagick unzip

          echo "Gerekli araçlar hazır."

      # ============================================================
      # 6 - ZIP DOSYASINI BUL
      # ============================================================
      - name: ZIP dosyasını bul
        shell: bash
        run: |
          set -e

          ZIP="donduteyze-apk-fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "HATA: $ZIP bulunamadı!"
            echo ""
            echo "Depodaki ZIP dosyaları:"
            find . -maxdepth 3 -type f \
              -name "*.zip" -o -name "*.ZIP" \
              -print
            exit 1
          fi

          echo "ZIP bulundu: $ZIP"

      # ============================================================
      # 7 - ZIP'İ AÇ
      # ============================================================
      - name: ZIP dosyasını aç
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "donduteyze-apk-fixed.zip" -d extracted

          echo ""
          echo "ZIP başarıyla açıldı."
          echo ""
          echo "İlk dosyalar:"
          find extracted -maxdepth 5 -type f | head -150

      # ============================================================
      # 8 - PROJEYİ BUL
      # ============================================================
      - name: Projeyi bul
        shell: bash
        run: |
          set -e

          PACKAGE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "package.json" \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "HATA: package.json bulunamadı!"
            find "$GITHUB_WORKSPACE/extracted" -type f | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE")"

          echo "======================================"
          echo "PROJE:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 9 - NPM
      # ============================================================
      - name: NPM paketlerini kur
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm install --no-package-lock

      # ============================================================
      # 10 - WEB UYGULAMASINI DERLE
      # ============================================================
      - name: Web uygulamasını derle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm run build

      # ============================================================
      # 11 - CAPACITOR ANDROID
      # ============================================================
      - name: Capacitor Android ekle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -d "android" ]; then
            echo "Android klasörü yok. Oluşturuluyor..."
            npx cap add android
          else
            echo "Android klasörü zaten mevcut."
          fi

      # ============================================================
      # 12 - CAPACITOR SYNC
      # ============================================================
      - name: Capacitor senkronize et
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap sync android

      # ============================================================
      #
