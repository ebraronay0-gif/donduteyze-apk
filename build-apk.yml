name: Build APK

on:
  push:
    branches: [ "ana", "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Web Projesini Derle (Build)
        run: npm run build

      - name: Capacitor Android Ekle ve Senkronize Et
        run: |
          npx cap add android || true
          npx cap sync android

      - name: KÖKTEN ÇÖZÜM - Tüm Capacitor İkonlarını Yok Et ve Döndü Teyze'yi Bas
        run: |
          RES_DIR="android/app/src/main/res"
          ICON_SOURCE="resources/launcher-icon-final.png"
          
          echo "🔥 Eski tüm ikon dosyaları kökten siliniyor..."
          find "$RES_DIR" -type f -name "*ic_launcher*" -delete
          find "$RES_DIR" -type f -name "*icon*" -delete
          
          echo "🖼️ Klasörler yeniden oluşturuluyor..."
          mkdir -p $RES_DIR/mipmap-mdpi $RES_DIR/mipmap-hdpi $RES_DIR/mipmap-xhdpi $RES_DIR/mipmap-xxhdpi $RES_DIR/mipmap-xxxhdpi
          
          echo "🎯 Döndü Teyze ikonları her boyuta tek tek yerleştiriliyor..."
          
          # Kare ikonlar
          cp $ICON_SOURCE $RES_DIR/mipmap-mdpi/ic_launcher.png
          cp $ICON_SOURCE $RES_DIR/mipmap-hdpi/ic_launcher.png
          cp $ICON_SOURCE $RES_DIR/mipmap-xhdpi/ic_launcher.png
          cp $ICON_SOURCE $RES_DIR/mipmap-xxhdpi/ic_launcher.png
          cp $ICON_SOURCE $RES_DIR/mipmap-xxxhdpi/ic_launcher.png
          
          # Yuvarlak ikonlar
          cp $ICON_SOURCE $RES_DIR/mipmap-mdpi/ic_launcher_round.png
          cp $ICON_SOURCE $RES_DIR/mipmap-hdpi/ic_launcher_round.png
          cp $ICON_SOURCE $RES_DIR/mipmap-xhdpi/ic_launcher_round.png
          cp $ICON_SOURCE $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png
          cp $ICON_SOURCE $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png
          
          # Ek olarak mipmap içindeki olası xml/webp arka planlarını da temizleyip düz PNG yapıyoruz
          rm -f $RES_DIR/mipmap-*/ic_launcher_background.xml
          rm -f $RES_DIR/mipmap-*/ic_launcher_foreground.xml

      - name: Android Manifest İkon Ayarını Sabitle
        run: |
          python3 - "android/app/src/main/AndroidManifest.xml" <<'PY'
          import sys
          import re

          manifest = sys.argv[1]
          with open(manifest, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(r'android:icon="@mipmap/[^"]+"', 'android:icon="@mipmap/ic_launcher"', text)
          text = re.sub(r'android:roundIcon="@mipmap/[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', text)

          with open(manifest, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Gradle ile APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasını Kaydet / Yükle
        uses: actions/upload-artifact@v4
        with:
          name: donduteyze-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
