      - name: DÖNDÜ TEYZE İKONUNU ZORLA UYGULA
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "===== DÖNDÜ TEYZE İKON DEĞİŞTİRME ====="

          ICON=""

          if [ -f "resources/launcher-icon-final.png" ]; then
            ICON="resources/launcher-icon-final.png"
          elif [ -f "resources/icon.png" ]; then
            ICON="resources/icon.png"
          else
            ICON=$(find . -type f \
              \( -iname "*launcher*icon*.png" -o -iname "icon.png" \) \
              -print -quit)
          fi

          if [ -z "$ICON" ]; then
            echo "HATA: İKON BULUNAMADI"
            exit 1
          fi

          echo "KULLANILAN İKON:"
          echo "$ICON"

          RES="android/app/src/main/res"

          echo "TÜM ESKİ LAUNCHER İKONLARI SİLİNİYOR..."

          find "$RES" -type f \
            \( -name "ic_launcher.*" \
            -o -name "ic_launcher_round.*" \
            -o -name "ic_launcher_foreground.*" \
            -o -name "ic_launcher_background.*" \) \
            -delete

          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi"

          echo "YENİ KLASÖRLER OLUŞTURULUYOR..."

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          echo "YENİ İKONLAR OLUŞTURULUYOR..."

          convert "$ICON" -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$ICON" -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$ICON" -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$ICON" -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$ICON" -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "===== İKON KONTROL ====="

          find "$RES" -type f \
            \( -name "ic_launcher.png" \
            -o -name "ic_launcher_round.png" \) \
            -print
