#!/bin/bash
set -e

echo "========================================"
echo "   DÖNDÜ TEYZE APK BUILD"
echo "========================================"

# Proje kök dizini
ROOT_DIR="$(cd "$(dirname "$0")/.." && pwd)"
cd "$ROOT_DIR"

echo "📁 Proje: $ROOT_DIR"

# --------------------------------------------------
# 1. Capacitor Android projesini senkronize et
# --------------------------------------------------

echo "🔄 Capacitor Android senkronizasyonu..."

npx cap sync android

# --------------------------------------------------
# 2. Döndü Teyze ikonunu kontrol et
# --------------------------------------------------

ICON_SOURCE="$ROOT_DIR/resources/launcher-icon-final.png"

if [ ! -f "$ICON_SOURCE" ]; then
    echo "❌ HATA: Döndü Teyze ikon dosyası bulunamadı:"
    echo "$ICON_SOURCE"
    exit 1
fi

echo "✅ Döndü Teyze ikonu bulundu."

# --------------------------------------------------
# 3. Android mipmap klasörlerini oluştur
# --------------------------------------------------

RES_DIR="$ROOT_DIR/android/app/src/main/res"

mkdir -p "$RES_DIR/mipmap-mdpi"
mkdir -p "$RES_DIR/mipmap-hdpi"
mkdir -p "$RES_DIR/mipmap-xhdpi"
mkdir -p "$RES_DIR/mipmap-xxhdpi"
mkdir -p "$RES_DIR/mipmap-xxxhdpi"

# --------------------------------------------------
# 4. Capacitor'un eski launcher ikonlarını temizle
# --------------------------------------------------

echo "🧹 Eski launcher ikonları temizleniyor..."

find "$RES_DIR" -type f \
    -name "ic_launcher.png" -o \
    -name "ic_launcher_round.png" -o \
    -name "ic_launcher_foreground.png" -o \
    -name "ic_launcher_background.png" \
 -delete

# --------------------------------------------------
# 5. Döndü Teyze ikonunu Android'e kopyala
# --------------------------------------------------

echo "🖼️ Döndü Teyze ikonu Android'e aktarılıyor..."

cp "$ICON_SOURCE" "$RES_DIR/mipmap-mdpi/ic_donduteyze.png"
cp "$ICON_SOURCE" "$RES_DIR/mipmap-hdpi/ic_donduteyze.png"
cp "$ICON_SOURCE" "$RES_DIR/mipmap-xhdpi/ic_donduteyze.png"
cp "$ICON_SOURCE" "$RES_DIR/mipmap-xxhdpi/ic_donduteyze.png"
cp "$ICON_SOURCE" "$RES_DIR/mipmap-xxxhdpi/ic_donduteyze.png"

# Yuvarlak ikon için de aynı Döndü Teyze ikonunu kullan
cp "$ICON_SOURCE" "$RES_DIR/mipmap-mdpi/ic_donduteyze_round.png"
cp "$ICON_SOURCE" "$RES_DIR/mipmap-hdpi/ic_donduteyze_round.png"
cp "$ICON_SOURCE" "$RES_DIR/mipmap-xhdpi/ic_donduteyze_round.png"
cp "$ICON_SOURCE" "$RES_DIR/mipmap-xxhdpi/ic_donduteyze_round.png"
cp "$ICON_SOURCE" "$RES_DIR/mipmap-xxxhdpi/ic_donduteyze_round.png"

# --------------------------------------------------
# 6. Android Manifest'i Döndü Teyze ikonuna bağla
# --------------------------------------------------

MANIFEST="$ROOT_DIR/android/app/src/main/AndroidManifest.xml"

if [ ! -f "$MANIFEST" ]; then
    echo "❌ AndroidManifest.xml bulunamadı!"
    exit 1
fi

echo "🔧 Android Manifest ikon ayarı yapılıyor..."

python3 - "$MANIFEST" <<'PY'
import sys
import re

manifest = sys.argv[1]

with open(manifest, "r", encoding="utf-8") as f:
    text = f.read()

text = re.sub(
    r'android:icon="@mipmap/[^"]+"',
    'android:icon="@mipmap/ic_donduteyze"',
    text
)

text = re.sub(
    r'android:roundIcon="@mipmap/[^"]+"',
    'android:roundIcon="@mipmap/ic_donduteyze_round"',
    text
)

with open(manifest, "w", encoding="utf-8") as f:
    f.write(text)
PY
